<html>

<head>
    <title>Campus Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Campus Shop</h1>

    <div id="shop">

        <div id="catalog">
            <h2>Products</h2>

            <p>Category:</p>
            <select id="category">
                <option value="all">All</option>
                <option value="school">School Supplies</option>
                <option value="daily">Daily Items</option>
            </select>

            <p>Sort by:</p>
            <select id="sort">
                <option value="default">Default</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>

            <p>
                <button id="addSelected" disabled>
                    Add Selected to Cart
                </button>
            </p>

            <div id="products"></div>
        </div>

        <div id="cart">
            <h2>Shopping Cart</h2>
            <div id="cartItems"></div>
        </div>

    </div>


    <h2>Add New Product</h2>

    <form id="productForm">

        <p>Name:</p>
        <input id="newName" type="text" required>

        <p>Price:</p>
        <input id="newPrice" type="number" min="0.01" step="0.01" required>

        <p>Description:</p>
        <textarea id="newDescription" required></textarea>

        <p>Category:</p>
        <select id="newCategory" required>
            <option value="school">School Supplies</option>
            <option value="daily">Daily Items</option>
        </select>

        <p>Image URL:</p>
        <input id="newImage" type="url" required>

        <p>
            <input type="submit">
        </p>

    </form>

    <button id="resetStore">Reset Store</button>

    <p id="formMessage"></p>

    <script src="script.js"></script>
</body>

</html>
